# ============================================================================
# Dashboard card snippet (mushroom-template-card)
# ============================================================================
# This does NOT automatically come along with the package — dashboards
# (Lovelace) are stored separately from your YAML config. Paste this
# manually into your own dashboard, or use it as a base for an existing
# card.
#
# Requires the "Mushroom" custom card (via HACS: "Mushroom" by piitaya).
#
# BEFORE YOU USE THIS:
#   - Replace sensor.FILL_IN_YOUR_POWER_SENSOR with your own sensor
#   - Replace "Device" with whatever name you want displayed
#   - Adjust the icon to taste
# ============================================================================

type: custom:mushroom-template-card
entity: sensor.FILL_IN_YOUR_POWER_SENSOR
primary: "Device"
icon: mdi:washing-machine
secondary: >-
  {% if is_state('sensor.FILL_IN_YOUR_POWER_SENSOR', '0.0') %}
  {% else %}
  {{ states('sensor.FILL_IN_YOUR_POWER_SENSOR') | int }}W
  {% if is_state('input_boolean.device_session_active', 'on') %}
  {{ states('sensor.device_remaining_time') }} min
  {% endif %}
  {% endif %}

# ============================================================================
# OPTIONAL — sessions per day (last 7 days)
# ============================================================================
# Uses the sensor.device_sessions_day0 .. day6 helpers from
# device_session_predictor.yaml (day0 = today, day6 = 6 days ago). This is
# a plain built-in "entities" card — no HACS needed. For an actual bar
# chart, feed the same 7 sensors into an "apexcharts-card" or "bar-card".
# ----------------------------------------------------------------------------
type: entities
title: Device sessions per day
entities:
  - entity: sensor.device_sessions_day0
    name: Today
  - entity: sensor.device_sessions_day1
    name: Yesterday
  - entity: sensor.device_sessions_day2
    name: 2 days ago
  - entity: sensor.device_sessions_day3
    name: 3 days ago
  - entity: sensor.device_sessions_day4
    name: 4 days ago
  - entity: sensor.device_sessions_day5
    name: 5 days ago
  - entity: sensor.device_sessions_day6
    name: 6 days ago
