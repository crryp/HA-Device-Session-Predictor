# ============================================================================
# Dashboard card snippet (mushroom-template-card)
# ============================================================================
# A compact card for your main dashboard: shows current power draw, and
# while a session runs the estimated remaining time. Tapping it opens the
# full detail subview (see dashboard-subview.yaml).
#
# Dashboards (Lovelace) are stored separately from your YAML config, so
# this does NOT come along with the package — paste it manually into your
# own dashboard via the card editor ("Manual" / YAML mode).
#
# Requires the "Mushroom" custom card (via HACS: "Mushroom" by piitaya).
#
# BEFORE YOU USE THIS:
#   - Replace sensor.FILL_IN_YOUR_POWER_SENSOR with your own power sensor
#   - Replace "Device" with whatever name you want displayed
#   - Adjust the icon to taste
#   - Set navigation_path to your detail subview. The format is
#     /<dashboard-url-path>/<view-path>, e.g. /lovelace/subview-washer.
#     It must match the `path:` you give the view in dashboard-subview.yaml.
#     Remove the whole tap_action block if you don't want the click-through.
# ============================================================================

type: custom:mushroom-template-card
entity: sensor.FILL_IN_YOUR_POWER_SENSOR
primary: "Device"
icon: mdi:washing-machine
secondary: >-
  {% if is_state('sensor.FILL_IN_YOUR_POWER_SENSOR', '0.0') %}
  {% else %}
  {{ states('sensor.FILL_IN_YOUR_POWER_SENSOR') | int }}W
  {% if is_state('input_boolean.device_session_active', 'on') %}
  {{ states('sensor.device_remaining_time') }} min
  {% endif %}
  {% endif %}
tap_action:
  action: navigate
  navigation_path: /lovelace/subview-device   # <-- ADJUST (see dashboard-subview.yaml `path:`)
