# ============================================================================
# Device Ready Notification (OPTIONAL)
# ============================================================================
# Builds on device_session_predictor.yaml — that file is required.
#
# Two parts, on purpose split like this:
#   1. A reusable SCRIPT (`device_ready_signal`) that does the actual work:
#      sets a light to a signal color, sends a push notification with a
#      confirmation button, waits up to 20 minutes for the tap (or for
#      someone to switch the light themselves), then restores the light to
#      a DETERMINISTIC resting state:
#        - it was on when the session ended        -> your resting scene
#        - it was off, and nobody touched it       -> off
#        - somebody switched it on during the wait -> your resting scene
#      Written once and parametrized (color / message / ok_action), so if
#      you use this for more than one appliance (washer + dryer, ...) you
#      only need ONE script — copy just the small automation below per
#      appliance, not the whole script.
#   2. A small per-appliance AUTOMATION that triggers on session end and
#      calls the script with that appliance's color and message.
#
# WHY NOT scene.create / snapshot?
#   An earlier version snapshotted the light with `scene.create` and
#   restored that. Two problems made it unreliable:
#     1. Gradient lamps (Hue Signe, gradient strips) expose only ONE color
#        to Home Assistant, so the snapshot flattened them — the restore
#        lost the gradient.
#     2. `light.turn_off` does not clear a bulb's color. After the signal
#        the bulb's "last color" stayed green, so the next plain "on"
#        (Google, wall switch, another automation) came back green.
#   This version fixes both: it restores by activating a real scene (which
#   sets a gradient lamp correctly), and on EVERY exit it re-asserts that
#   scene first — so the signal color is never left as the bulb's last
#   color — before optionally turning the light back off.
#
# WHY THE repeat/until LOOP around the wait?
#   A gradient lamp keeps reporting small color corrections for 10-60 s
#   after you set it (the zones settle). Each report is a state change on
#   the light, which would end a plain `wait_for_trigger` early and cut
#   the signal short. The loop re-arms the wait and only really exits on:
#   the Ok tap, the 20-minute deadline, or a state change that carries a
#   context.user_id (a genuine action from Google / the app / a dashboard;
#   the lamp's own trailing reports have no user_id).
#
# BEFORE YOU USE THIS:
#   1. Make sure device_session_predictor.yaml is active (this file uses
#      input_boolean.device_session_active from it).
#   2. In the SCRIPT: fill in your signal light (search "FILL_IN"). Use a
#      light GROUP entity if you want to signal on several lamps at once.
#      Fill in your notify service and the resting scene: what the light
#      should look like whenever it is normally on (e.g. a Hue "Relax"
#      scene). A gradient lamp only comes back correctly if this is a real
#      scene that includes it. Hue + gradient lamp: swap `scene.turn_on`
#      for `hue.activate_scene` (same target, add `dynamic: true` in data
#      if your resting scene is a dynamic Hue scene).
#   3. In the AUTOMATION: adjust the signal color/message, and give
#      `ok_action` a value that's unique per appliance if you reuse the
#      script for more than one (it identifies which notification's Ok
#      button was tapped).
# ============================================================================

script:
  device_ready_signal:
    alias: "Device ready signal"
    icon: mdi:bell-ring
    description: >-
      Shared by every appliance's ready notification. Sets a light to a
      signal color, sends a push with an Ok button, waits up to 20 minutes
      for the tap (or a genuine manual change to the light), then restores
      the light to a deterministic resting state. Called with a different
      color/message/ok_action per appliance — see the automation below.
    mode: restart
    fields:
      color:
        description: "Signal color as [r, g, b]"
        example: "[0, 255, 0]"
        selector:
          object: {}
      message:
        description: "Push notification text"
        example: "Washer is ready"
        selector:
          text: {}
      ok_action:
        description: >-
          notification action id for the Ok button. Must be unique per
          appliance if you call this script for more than one.
        example: "washer_ready_ok"
        selector:
          text: {}
    sequence:
      # Was the signal light already on when the session ended? And when
      # does the 20-minute window end? Both captured once, at the start.
      - variables:
          was_on: "{{ is_state('light.FILL_IN_YOUR_LIGHT', 'on') }}"   # <-- ADJUST
          window_end: "{{ now().timestamp() + 1200 }}"

      # 1. Signal color. Remove this + the restore block if you only want
      #    the push notification without a light effect.
      - action: light.turn_on
        target:
          entity_id: light.FILL_IN_YOUR_LIGHT   # <-- ADJUST
        data:
          rgb_color: "{{ color }}"
          brightness_pct: 50

      # 2. Let the light settle a little before the wait starts listening.
      - delay:
          seconds: 2

      # 3. Notification with a confirmation button.
      - action: notify.FILL_IN_YOUR_NOTIFY_SERVICE   # <-- ADJUST, e.g. notify.mobile_app_my_phone or notify.notify
        data:
          message: "{{ message }}"
          data:
            actions:
              - action: "{{ ok_action }}"
                title: "Ok"

      # 4. Wait for: the Ok tap, OR a genuine manual change to the light,
      #    OR the 20-minute deadline. The loop ignores the gradient lamp's
      #    own trailing color reports (no context.user_id) and keeps
      #    waiting for the remaining time.
      - repeat:
          sequence:
            - wait_for_trigger:
                - trigger: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: "{{ ok_action }}"
                  id: ok
                - trigger: state
                  entity_id: light.FILL_IN_YOUR_LIGHT   # <-- ADJUST (same as above)
                  id: override
              timeout:
                seconds: "{{ [ (window_end - now().timestamp()) | int, 0 ] | max }}"
              continue_on_timeout: true
          until:
            - "{{ not wait.completed
                  or wait.trigger.id == 'ok'
                  or wait.trigger.to_state.context.user_id is not none }}"

      # 5. Decide the end state. "On" only counts if the light was on
      #    before, or a person genuinely switched it on during the wait —
      #    not because step 1 made it the signal color.
      - variables:
          should_be_on: >-
            {{ is_state('light.FILL_IN_YOUR_LIGHT', 'on')
               and (was_on or (wait.completed and wait.trigger is not none
                               and wait.trigger.id == 'override'
                               and wait.trigger.to_state.context.user_id is not none)) }}

      # 6. Restore. Re-apply the resting scene on EVERY exit path (this is
      #    what guarantees the signal color is never left behind on the
      #    bulb), then turn the light back off if it should be off.
      #
      #    The turn-off has NO transition on purpose: a fade-to-off ramps
      #    brightness toward 0, and some bulbs then remember ~0 as their
      #    last "on" level — so the next plain "on" comes up almost dark.
      #    An instant off leaves the resting scene's brightness intact for
      #    next time.
      - action: scene.turn_on
        target:
          entity_id: scene.FILL_IN_YOUR_RESTING_SCENE   # <-- ADJUST
        data:
          transition: 1.5
      - if:
          - condition: template
            value_template: "{{ not should_be_on }}"
        then:
          - delay:
              seconds: 2
          - action: light.turn_off
            target:
              entity_id: light.FILL_IN_YOUR_LIGHT   # <-- ADJUST

automation:
  - id: device_ready_notification
    alias: "Device ready notification"
    description: >-
      On session end, calls device_ready_signal with this appliance's
      color and message. If you're signalling several appliances with the
      shared script above, copy just this automation block per appliance
      (new id/alias, its own trigger entity, its own ok_action).
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.device_session_active
        to: "off"
    actions:
      - action: script.device_ready_signal
        data:
          color: [0, 255, 0]   # <-- ADJUST: signal color (here: green)
          message: "Device is ready"   # <-- ADJUST
          ok_action: "device_ready_ok"   # <-- ADJUST: unique per appliance if reused
